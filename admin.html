<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>商家管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f1f5f9; padding: 16px; max-width: 800px; margin: 0 auto; padding-bottom: 100px; }
        h1 { font-size: 24px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .sub { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .card h2 { font-size: 17px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 500; font-size: 14px; color: #334155; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; transition: 0.15s; }
        .form-group input:focus { border-color: #3b82f6; outline: none; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { border: none; padding: 10px 24px; border-radius: 40px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.15s; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:active { transform: scale(0.95); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:active { transform: scale(0.95); }
        .btn-sm { padding: 6px 16px; font-size: 13px; }
        .btn-outline { background: transparent; border: 2px solid #e2e8f0; }
        .btn-success { background: #16a34a; color: white; }
        .btn-success:active { transform: scale(0.95); }
        .btn-ghost { background: transparent; color: #475569; border: 1px solid #e2e8f0; }
        .btn-ghost:active { transform: scale(0.95); }
        .btn-copy { background: #8b5cf6; color: white; }
        .btn-copy:active { transform: scale(0.95); }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:active { transform: scale(0.95); }
        .product-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .product-item:last-child { border-bottom: none; }
        .product-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; background: #eef2f6; }
        .product-item .info { flex: 1; }
        .product-item .info .name { font-weight: 600; font-size: 15px; }
        .product-item .info .price { color: #2563eb; font-weight: 600; font-size: 14px; }
        .product-item .info .stock { font-size: 13px; color: #64748b; }
        .product-item .info .stock.low { color: #ef4444; font-weight: 600; }
        .product-item .info .stock.out { color: #ef4444; font-weight: 700; }
        .product-item .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .empty-state { text-align: center; color: #94a3b8; padding: 30px 0; }
        .preview-img { margin-top: 8px; max-width: 120px; max-height: 120px; border-radius: 12px; display: none; border: 2px solid #e2e8f0; }
        .preview-img.show { display: block; }
        .switch-link { display: inline-block; margin-top: 12px; color: #3b82f6; text-decoration: none; font-weight: 500; }
        .upload-area { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .upload-area input[type="file"] { flex: 1; padding: 8px; border: 2px dashed #e2e8f0; border-radius: 12px; cursor: pointer; }
        .upload-area input[type="file"]:hover { border-color: #3b82f6; }
        .tab-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .tab-btn { padding: 8px 20px; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; background: #e2e8f0; color: #64748b; transition: 0.15s; }
        .tab-btn.active { background: #2563eb; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* ====== 订单样式 ====== */
        .order-item {
            border: 1px solid #f1f5f9;
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: 0.15s;
        }
        .order-item:last-child { margin-bottom: 0; }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            background: white;
            transition: 0.15s;
            flex-wrap: wrap;
            gap: 8px;
        }
        .order-header:hover { background: #f8fafc; }
        .order-header:active { background: #f1f5f9; }
        .order-header .order-main { flex: 1; min-width: 120px; }
        .order-header .order-nickname {
            background: #dbeafe;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            color: #1d4ed8;
            display: inline-block;
        }
        .order-header .order-time {
            color: #94a3b8;
            font-size: 12px;
            display: block;
            margin-top: 2px;
        }
        .order-header .order-summary {
            color: #64748b;
            font-size: 13px;
            margin-top: 2px;
        }
        .order-header .order-right {
            text-align: right;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .order-header .order-total {
            font-weight: 700;
            color: #2563eb;
            font-size: 17px;
        }
        .order-status {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .order-status.pending { background: #fef3c7; color: #d97706; }
        .order-status.done { background: #d1fae5; color: #065f46; }
        .order-toggle-icon {
            color: #94a3b8;
            font-size: 18px;
            transition: 0.2s;
            user-select: none;
        }
        .order-toggle-icon.open { transform: rotate(180deg); }
        
        /* ====== 订单详情 ====== */
        .order-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            padding: 0 16px;
            background: #f8fafc;
        }
        .order-details.open {
            max-height: 800px;
            padding: 12px 16px 16px 16px;
        }
        .order-detail-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #e9edf2;
            font-size: 14px;
        }
        .order-detail-item:last-child { border-bottom: none; }
        .order-detail-item .qty {
            background: #eef2f6;
            padding: 0 10px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 13px;
        }
        .order-detail-item .subtotal {
            font-weight: 500;
            color: #1e293b;
        }
        .order-detail-total {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 16px;
            padding-top: 10px;
            margin-top: 6px;
            border-top: 2px solid #e2e8f0;
            color: #0f172a;
        }
        .order-detail-total .amount { color: #2563eb; }
        .order-actions-detail {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #e9edf2;
            flex-wrap: wrap;
        }

        .copy-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #065f46;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 999;
            pointer-events: none;
        }
        .copy-toast.show { opacity: 1; }

        .badge-new {
            background: #ef4444;
            color: white;
            font-size: 11px;
            border-radius: 30px;
            padding: 0 8px;
            line-height: 20px;
            display: inline-block;
            margin-left: 6px;
        }
        .currency-symbol {
            font-weight: 400;
            font-size: 14px;
            margin-right: 1px;
        }
        .empty-orders {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
        }
        .order-count-badge {
            background: #e2e8f0;
            color: #475569;
            font-size: 13px;
            border-radius: 30px;
            padding: 0 12px;
            line-height: 24px;
            font-weight: 600;
        }
        .order-count-badge.pending-count {
            background: #fef3c7;
            color: #d97706;
        }
        .stock-input-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stock-input-group input {
            width: 70px;
            padding: 8px 10px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
        }
        .stock-input-group input:focus {
            border-color: #3b82f6;
            outline: none;
        }
        .stock-input-group .stock-label {
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="copy-toast" id="copyToast">✅ 已复制到剪贴板！</div>

    <h1>
        🛠️ 商家中心
        <span style="font-size:14px; font-weight:400; color:#64748b;">管理商品 & 订单</span>
    </h1>
    <div class="sub">📦 设置库存 · 客户点单自动检查</div>

    <!-- Tab 切换 -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('products')">📦 商品管理</button>
        <button class="tab-btn" onclick="switchTab('orders')">
            📋 订单记录
            <span id="orderBadge" style="display:none;" class="badge-new">新</span>
            <span class="order-count-badge pending-count" id="pendingCount">0</span>
        </button>
    </div>

    <!-- ====== 商品管理 Tab ====== -->
    <div id="tab-products" class="tab-content active">
        <div class="card">
            <h2 id="formTitle">➕ 添加商品</h2>
            <form id="productForm">
                <input type="hidden" id="editId" value="">
                <div class="form-group">
                    <label>商品名称 *</label>
                    <input type="text" id="productName" placeholder="例如：美式咖啡" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>价格 (RM) *</label>
                        <input type="number" id="productPrice" placeholder="18.00" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>📦 库存数量 *</label>
                        <input type="number" id="productStock" placeholder="99" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>📸 商品图片</label>
                        <div class="upload-area" style="flex-direction:column; gap:6px;">
                            <input type="file" id="imageFile" accept="image/*" capture="environment" style="width:100%;">
                            <span style="color:#94a3b8; font-size:12px;">或输入网址</span>
                            <input type="url" id="productImage" placeholder="图片网址" style="width:100%;">
                        </div>
                        <img id="imagePreview" class="preview-img" alt="预览">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn">➕ 添加商品</button>
                <button type="button" class="btn btn-outline" id="cancelEditBtn" style="display:none;">取消编辑</button>
            </form>
        </div>

        <div class="card">
            <h2>📋 商品列表 (<span id="productCount">0</span>)</h2>
            <div id="productList"></div>
        </div>
    </div>

    <!-- ====== 订单记录 Tab ====== -->
    <div id="tab-orders" class="tab-content">
        <div class="card">
            <h2>📋 历史订单 <span id="orderTotalCount" style="font-size:14px; font-weight:400; color:#94a3b8;"></span></h2>
            <div id="orderList"></div>
        </div>
    </div>

    <a href="index.html" class="switch-link">← 返回点单页面</a>

    <script>
        // ============================================================
        //  DATA
        // ============================================================
        const STORAGE_KEY = 'menu_items';
        const ORDERS_KEY = 'order_history';

        function loadProducts() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try { return JSON.parse(data); } catch (e) { return []; }
            }
            const defaults = [
                { id: 1, name: '美式咖啡', price: 18, stock: 10, img: 'https://placehold.co/300x300/3b82f6/white?text=☕' },
                { id: 2, name: '拿铁', price: 22, stock: 8, img: 'https://placehold.co/300x300/8b5cf6/white?text=☕' },
                { id: 3, name: '卡布奇诺', price: 24, stock: 5, img: 'https://placehold.co/300x300/d946ef/white?text=☕' },
            ];
            saveProducts(defaults);
            return defaults;
        }

        function saveProducts(products) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        }

        function loadOrders() {
            const data = localStorage.getItem(ORDERS_KEY);
            if (data) {
                try { return JSON.parse(data); } catch (e) { return []; }
            }
            return [];
        }

        function saveOrders(orders) {
            localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
        }

        let products = loadProducts();
        let orders = loadOrders();

        // ============================================================
        //  FORMAT
        // ============================================================
        function formatPrice(amount) {
            return 'RM ' + amount.toFixed(2);
        }

        function getStockText(stock) {
            if (stock === undefined || stock === null) return '⚪ 无限';
            if (stock <= 0) return '❌ 已售罄';
            if (stock <= 3) return '⚠️ 仅剩 ' + stock + ' 件';
            return '📦 ' + stock + ' 件';
        }

        function getStockClass(stock) {
            if (stock === undefined || stock === null) return '';
            if (stock <= 0) return 'out';
            if (stock <= 3) return 'low';
            return '';
        }

        // ============================================================
        //  TAB SWITCH
        // ============================================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
            if (tab === 'orders') {
                renderOrders();
                document.getElementById('orderBadge').style.display = 'none';
            }
        }

        // ============================================================
        //  IMAGE HANDLER
        // ============================================================
        function handleImageFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                document.getElementById('productImage').value = imageUrl;
                document.getElementById('imagePreview').src = imageUrl;
                document.getElementById('imagePreview').classList.add('show');
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('imageFile').addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                handleImageFile(this.files[0]);
            }
        });

        // ============================================================
        //  PRODUCT MANAGEMENT
        // ============================================================
        function renderProducts() {
            const container = document.getElementById('productList');
            const count = document.getElementById('productCount');
            count.textContent = products.length;

            if (products.length === 0) {
                container.innerHTML = `<div class="empty-state">还没有商品，添加一个吧 🛒</div>`;
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="product-item">
                    <img src="${p.img || 'https://placehold.co/300x300/e2e8f0/64748b?text=?'}" alt="${p.name}" onerror="this.src='https://placehold.co/300x300/e2e8f0/64748b?text=?'">
                    <div class="info">
                        <div class="name">${p.name}</div>
                        <div class="price">${formatPrice(p.price)}</div>
                        <div class="stock ${getStockClass(p.stock)}">${getStockText(p.stock)}</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-sm btn-outline" onclick="editProduct(${p.id})">✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        // ============================================================
        //  快速更新库存（在商品列表里直接修改）
        // ============================================================
        function updateStock(id, newStock) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            product.stock = Math.max(0, parseInt(newStock) || 0);
            saveProducts(products);
            renderProducts();
        }

        function handleSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('productName').value.trim();
            const price = parseFloat(document.getElementById('productPrice').value);
            const stock = parseInt(document.getElementById('productStock').value) || 0;
            let img = document.getElementById('productImage').value.trim();
            const editId = document.getElementById('editId').value;

            if (!name || isNaN(price) || price <= 0) {
                alert('请正确填写名称和价格');
                return;
            }

            if (!img) {
                img = 'https://placehold.co/300x300/e2e8f0/64748b?text=📦';
            }

            if (editId) {
                const index = products.findIndex(p => p.id === Number(editId));
                if (index !== -1) {
                    products[index] = { ...products[index], name, price, stock, img };
                }
            } else {
                const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                products.push({ id: newId, name, price, stock, img });
            }

            saveProducts(products);
            renderProducts();
            resetForm();
            alert('✅ 商品已保存！');
        }

        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            document.getElementById('editId').value = id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productStock').value = product.stock || 0;
            document.getElementById('productImage').value = product.img || '';
            document.getElementById('formTitle').textContent = '✏️ 编辑商品';
            document.getElementById('submitBtn').textContent = '💾 保存修改';
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
            if (product.img) {
                document.getElementById('imagePreview').src = product.img;
                document.getElementById('imagePreview').classList.add('show');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProduct(id) {
            if (!confirm('确定要删除这个商品吗？')) return;
            products = products.filter(p => p.id !== id);
            saveProducts(products);
            renderProducts();
            if (document.getElementById('editId').value == id) resetForm();
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('formTitle').textContent = '➕ 添加商品';
            document.getElementById('submitBtn').textContent = '➕ 添加商品';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('imagePreview').classList.remove('show');
            document.getElementById('imageFile').value = '';
            document.getElementById('productStock').value = '';
        }

        document.getElementById('productImage').addEventListener('input', function() {
            if (this.value) {
                document.getElementById('imagePreview').src = this.value;
                document.getElementById('imagePreview').classList.add('show');
            } else {
                document.getElementById('imagePreview').classList.remove('show');
            }
        });

        document.getElementById('cancelEditBtn').addEventListener('click', resetForm);
        document.getElementById('productForm').addEventListener('submit', handleSubmit);

        // ============================================================
        //  COPY TO CLIPBOARD
        // ============================================================
        function copyOrderItems(index) {
            orders = loadOrders();
            const order = orders[index];
            if (!order || !order.items || order.items.length === 0) {
                showToast('❌ 没有商品可复制');
                return;
            }

            let text = `📋 订单 #${index + 1}\n`;
            text += `👤 ${order.nickname || '匿名'}\n`;
            text += `━━━━━━━━━━━━━━━━━━━\n`;
            order.items.forEach(item => {
                text += `  ${item.name}  ×${item.qty}\n`;
            });
            text += `━━━━━━━━━━━━━━━━━━━\n`;
            text += `📦 共 ${order.items.reduce((sum, i) => sum + i.qty, 0)} 件商品`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('✅ 已复制商品清单！');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ 已复制商品清单！');
            } catch (e) {
                showToast('❌ 复制失败，请手动复制');
            }
            document.body.removeChild(textarea);
        }

        // ============================================================
        //  TOAST
        // ============================================================
        let toastTimeout = null;

        function showToast(message) {
            const toast = document.getElementById('copyToast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        //  ORDER MANAGEMENT
        // ============================================================
        function renderOrders() {
            const container = document.getElementById('orderList');
            orders = loadOrders();

            const pending = orders.filter(o => o.status !== 'done').length;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('orderTotalCount').textContent = `(共 ${orders.length} 单)`;

            if (orders.length === 0) {
                container.innerHTML = `<div class="empty-orders">📭 暂无订单</div>`;
                return;
            }

            const sortedOrders = [...orders].reverse();

            container.innerHTML = sortedOrders.map((order, index) => {
                const realIndex = orders.length - 1 - index;
                const itemsSummary = order.items.map(i => `${i.name} ×${i.qty}`).join('、');

                return `
                    <div class="order-item">
                        <div class="order-header" onclick="toggleOrder(this, ${realIndex})">
                            <div class="order-main">
                                <div>
                                    <span class="order-nickname">👤 ${order.nickname || '匿名'}</span>
                                    <span class="order-status ${order.status || 'pending'}">${order.status === 'done' ? '✅ 已完成' : '⏳ 待处理'}</span>
                                </div>
                                <div class="order-summary">${itemsSummary}</div>
                                <span class="order-time">${order.time || '刚刚'}</span>
                            </div>
                            <div class="order-right">
                                <div class="order-total">${formatPrice(order.total)}</div>
                                <span class="order-toggle-icon">▼</span>
                            </div>
                        </div>
                        <div class="order-details" id="orderDetails-${realIndex}">
                            ${renderOrderDetails(order, realIndex)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderOrderDetails(order, index) {
            let itemsHtml = order.items.map(item => `
                <div class="order-detail-item">
                    <span><strong>${item.name}</strong>  <span class="qty">×${item.qty}</span></span>
                    <span class="subtotal">${formatPrice(item.price * item.qty)}</span>
                </div>
            `).join('');

            const isPending = order.status !== 'done';
            const totalQty = order.items.reduce((sum, i) => sum + i.qty, 0);

            return `
                ${itemsHtml}
                <div class="order-detail-total">
                    <span>合计 (${totalQty} 件)</span>
                    <span class="amount">${formatPrice(order.total)}</span>
                </div>
                <div class="order-actions-detail">
                    <button class="btn btn-sm btn-copy" onclick="copyOrderItems(${index})">📋 复制清单</button>
                    ${isPending ? `<button class="btn btn-sm btn-success" onclick="markOrderDone(${index})">✅ 标记完成</button>` : ''}
                    <button class="btn btn-sm btn-ghost" onclick="deleteOrder(${index})">🗑️ 删除</button>
                </div>
            `;
        }

        function toggleOrder(headerEl, index) {
            const details = document.getElementById(`orderDetails-${index}`);
            const icon = headerEl.querySelector('.order-toggle-icon');
            
            if (details.classList.contains('open')) {
                details.classList.remove('open');
                icon.classList.remove('open');
                icon.textContent = '▼';
            } else {
                details.classList.add('open');
                icon.classList.add('open');
                icon.textContent = '▲';
            }
        }

        window.markOrderDone = function(index) {
            orders = loadOrders();
            if (orders[index]) {
                orders[index].status = 'done';
                saveOrders(orders);
                renderOrders();
                showToast('✅ 已标记为完成');
            }
        };

        window.deleteOrder = function(index) {
            if (!confirm('确定要删除这个订单吗？')) return;
            orders = loadOrders();
            orders.splice(index, 1);
            saveOrders(orders);
            renderOrders();
            showToast('🗑️ 已删除订单');
        };

        // ============================================================
        //  接收新订单（自动扣减库存）
        // ============================================================
        window.receiveOrder = function(orderData) {
            orders = loadOrders();
            
            // 扣减库存
            let stockErrors = [];
            orderData.items.forEach(item => {
                const product = products.find(p => p.id === item.id);
                if (product) {
                    const currentStock = product.stock !== undefined ? product.stock : 999;
                    if (currentStock < item.qty) {
                        stockErrors.push(`${product.name}（需要 ${item.qty}，剩余 ${currentStock}）`);
                    } else {
                        product.stock = Math.max(0, currentStock - item.qty);
                    }
                }
            });

            // 如果有库存不足，阻止下单并回滚
            if (stockErrors.length > 0) {
                // 恢复库存（因为上面的修改已经改了，需要重新加载）
                products = loadProducts();
                alert(`❌ 库存不足！\n\n以下商品库存不够：\n${stockErrors.join('\n')}\n\n请修改订单数量。`);
                return false;
            }

            // 保存更新后的库存
            saveProducts(products);

            // 保存订单
            orders.push({
                nickname: orderData.nickname || '匿名',
                items: orderData.items,
                total: orderData.total,
                time: orderData.time || new Date().toLocaleString(),
                status: 'pending'
            });
            saveOrders(orders);

            document.getElementById('orderBadge').style.display = 'inline-block';
            document.getElementById('pendingCount').textContent = orders.filter(o => o.status !== 'done').length;
            if (document.getElementById('tab-orders').classList.contains('active')) {
                renderOrders();
            }
            // 更新商品列表（库存变化）
            renderProducts();
            showToast('🆕 收到新订单！库存已自动更新');
            return true;
        };

        // ============================================================
        //  INIT
        // ============================================================
        renderProducts();
        renderOrders();
        console.log('✅ 商家后台加载成功！');
        console.log('📦 商品数:', products.length);
        console.log('📋 订单数:', orders.length);
    </script>
</body>
</html>
