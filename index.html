<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点单</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f4f6fa;
            padding: 12px;
            padding-bottom: 100px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 4px;
        }
        .header h1 {
            font-size: 20px;
            color: #1e293b;
        }
        .header h1 span {
            font-size: 12px;
            font-weight: 400;
            color: #64748b;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .status {
            font-size: 11px;
            color: #16a34a;
            font-weight: 500;
        }
        .status.loading {
            color: #f59e0b;
        }
        .status.error {
            color: #ef4444;
        }

        .lang-toggle {
            display: flex;
            gap: 4px;
            background: white;
            border-radius: 30px;
            padding: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .lang-toggle button {
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            background: transparent;
            color: #94a3b8;
            transition: 0.15s;
        }
        .lang-toggle button.active {
            background: #2563eb;
            color: white;
        }
        .lang-toggle button:active {
            transform: scale(0.95);
        }

        .btn-history {
            background: #e2e8f0;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            color: #1e293b;
        }
        .btn-history:active {
            transform: scale(0.95);
        }

        .nickname-area {
            background: white;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .nickname-area label {
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
        }
        .nickname-area input {
            flex: 1;
            padding: 6px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 30px;
            font-size: 14px;
            min-width: 100px;
        }
        .nickname-area input:focus {
            border-color: #3b82f6;
            outline: none;
        }
        .nickname-area .hint {
            color: #94a3b8;
            font-size: 11px;
        }

        .order-options {
            background: white;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .order-options .option-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .order-options .option-row:last-child {
            margin-bottom: 0;
        }
        .order-options label {
            font-weight: 500;
            font-size: 13px;
            color: #1e293b;
            min-width: 70px;
        }
        .order-options select,
        .order-options input[type="text"],
        .order-options input[type="datetime-local"] {
            padding: 6px 10px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 13px;
            background: white;
            flex: 1;
            min-width: 120px;
        }
        .order-options select:focus,
        .order-options input:focus {
            border-color: #3b82f6;
            outline: none;
        }
        .order-options .hint {
            font-size: 11px;
            color: #94a3b8;
        }
        .order-options .payment-options {
            display: flex;
            gap: 10px;
        }
        .order-options .payment-options label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 400;
            font-size: 13px;
            min-width: auto;
            cursor: pointer;
        }
        .order-options .payment-options input[type="radio"] {
            accent-color: #2563eb;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 12px 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            border: 2px solid transparent;
            text-align: center;
            position: relative;
            transition: 0.1s;
        }
        .card:active {
            transform: scale(0.95);
            border-color: #3b82f6;
        }
        .card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 12px;
            background: #eef2f6;
            display: block;
            margin-bottom: 8px;
        }
        .card .name {
            font-weight: 600;
            color: #0f172a;
            font-size: 14px;
        }
        .card .price {
            color: #2563eb;
            font-weight: 700;
            font-size: 15px;
        }
        .card .stock-info {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .card .stock-info.low {
            color: #ef4444;
            font-weight: 600;
        }
        .card .stock-info.out {
            color: #ef4444;
            font-weight: 700;
        }
        .card.sold-out {
            opacity: 0.6;
            cursor: not-allowed;
            border-color: #ef4444;
        }
        .badge {
            display: inline-block;
            background: #3b82f6;
            color: white;
            font-size: 12px;
            font-weight: 600;
            border-radius: 30px;
            padding: 0 8px;
            line-height: 20px;
            margin-top: 4px;
        }
        .sold-out-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 30px;
        }

        .cart-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(0, 0, 0, 0.03);
        }
        .cart-info {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }
        .cart-info .total-items {
            background: #eef2f6;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
        }
        .cart-info .total-price {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
        }
        .cart-info .total-price span {
            font-size: 13px;
            font-weight: 400;
            color: #64748b;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            border: none;
            padding: 8px 18px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            background: #eef2f6;
            color: #1e293b;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .btn-primary:active {
            background: #1d4ed8;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:active {
            background: #dc2626;
        }
        .btn-success {
            background: #16a34a;
            color: white;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }
        .btn-success:active {
            background: #15803d;
        }
        .btn-ghost {
            background: transparent;
            color: #475569;
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
            min-width: 28px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 16px;
        }
        .modal.active {
            display: flex;
        }
        .modal-box {
            background: white;
            max-width: 420px;
            width: 100%;
            padding: 20px;
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            animation: fadeUp 0.2s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-box h2 {
            font-size: 20px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-box .sub {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .modal-box .nickname-display {
            font-size: 13px;
            color: #3b82f6;
            margin-bottom: 8px;
        }
        .modal-box .order-list {
            margin: 12px 0;
            max-height: 250px;
            overflow-y: auto;
            border-top: 1px solid #e9edf2;
            border-bottom: 1px solid #e9edf2;
            padding: 6px 0;
        }
        .order-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #edf0f5;
            font-size: 14px;
            gap: 6px;
        }
        .order-row:last-child {
            border-bottom: none;
        }
        .order-row .info {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }
        .order-row .info .name {
            font-weight: 600;
            min-width: 40px;
            font-size: 14px;
        }
        .order-row .info .qty {
            background: #eef2f6;
            padding: 0 8px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 12px;
            min-width: 20px;
            text-align: center;
        }
        .order-row .qty-controls {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .order-row .qty-controls button {
            background: #eef2f6;
            border: none;
            border-radius: 30px;
            width: 24px;
            height: 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .order-row .qty-controls button:active {
            transform: scale(0.9);
        }
        .order-row .subtotal {
            font-weight: 500;
            color: #1e293b;
            min-width: 50px;
            text-align: right;
            font-size: 13px;
        }
        .order-row .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }
        .order-row .delete-btn:active {
            transform: scale(0.8);
        }
        .modal-total {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 18px;
            margin: 12px 0 12px;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .history-item {
            border: 1px solid #f1f5f9;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            background: #fafbfc;
        }
        .history-item:last-child {
            margin-bottom: 0;
        }
        .history-item .h-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }
        .history-item .h-top .h-nickname {
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
        }
        .history-item .h-top .h-status {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .history-item .h-top .h-status.pending {
            background: #fef3c7;
            color: #d97706;
        }
        .history-item .h-top .h-status.done {
            background: #d1fae5;
            color: #065f46;
        }
        .history-item .h-items {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 2px;
        }
        .history-item .h-time {
            font-size: 11px;
            color: #94a3b8;
        }
        .history-item .h-total {
            font-weight: 700;
            color: #2563eb;
            font-size: 15px;
        }
        .history-item .h-options {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
            padding-top: 6px;
            border-top: 1px dashed #e9edf2;
        }

        .history-empty {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
        }
        .history-empty p:first-child {
            font-size: 16px;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
        }
        .empty-state p:first-child {
            font-size: 16px;
        }
        .empty-state p:last-child {
            font-size: 13px;
        }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .option-summary {
            font-size: 12px;
            color: #3b82f6;
            margin-top: 4px;
            padding: 6px 10px;
            background: #eff6ff;
            border-radius: 8px;
            display: none;
        }
        .option-summary.show {
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="pageTitle">🧾 点单台 <span>· 点击加购</span></h1>
        <div class="header-right">
            <button class="btn-history" id="historyBtn">📋 <span id="historyBtnText">订单</span></button>
            <div class="lang-toggle">
                <button class="active" onclick="setLanguage('zh')" id="langZh">中</button>
                <button onclick="setLanguage('en')" id="langEn">EN</button>
            </div>
            <span class="status" id="status">● 已连接</span>
        </div>
    </div>

    <div class="nickname-area">
        <label id="nicknameLabel">👤 昵称</label>
        <input type="text" id="nicknameInput" placeholder="你的名字" maxlength="20">
        <span class="hint" id="nicknameHint">(商家识别你)</span>
    </div>

    <!-- ===== 取餐地点 + 取餐时间 + 付款方式 ===== -->
    <div class="order-options">
        <div class="option-row">
            <label id="pickupLocationLabel">📍 取餐地点</label>
            <input type="text" id="pickupLocation" placeholder="例：A区柜台、打包台">
        </div>
        <div class="option-row">
            <label id="pickupTimeLabel">⏰ 取餐时间</label>
            <input type="datetime-local" id="pickupTime">
        </div>
        <div class="option-row">
            <label id="paymentLabel">💳 付款方式</label>
            <div class="payment-options">
                <label>
                    <input type="radio" name="payment" value="QR" checked> QR
                </label>
                <label>
                    <input type="radio" name="payment" value="Cash"> Cash
                </label>
            </div>
        </div>
        <div class="option-summary" id="optionSummary"></div>
    </div>

    <div class="grid" id="menuGrid">
        <div class="empty-state"><p id="loadingText">⏳ 加载中 <span class="loading-spinner"></span></p></div>
    </div>

    <!-- ===== 购物车 ===== -->
    <div class="cart-panel">
        <div class="cart-info">
            <span class="total-items" id="totalItems">0 件</span>
            <span class="total-price" id="totalPrice">RM0 <span id="totalLabel">总计</span></span>
        </div>
        <div class="actions">
            <button class="btn" id="clearCartBtn">🗑️</button>
            <button class="btn btn-primary" id="checkoutBtn">📦 <span id="checkoutText">结单</span></button>
        </div>
    </div>

    <!-- ===== 确认订单弹窗 ===== -->
    <div class="modal" id="orderModal">
        <div class="modal-box">
            <h2 id="confirmTitle">📋 确认订单</h2>
            <p class="sub" id="confirmSub">请核对以下商品</p>
            <div class="nickname-display" id="modalNickname">👤 昵称：未设置</div>
            <div id="modalOptions" style="font-size:13px; color:#64748b; margin-bottom:8px;"></div>
            <div class="order-list" id="orderList"></div>
            <div class="modal-total">
                <span id="totalLabel2">合计</span>
                <span id="modalTotalPrice">RM0</span>
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="closeModalBtn"><span id="editBtnText">修改</span></button>
                <button class="btn btn-success" id="confirmOrderBtn">✅ <span id="confirmBtnText">确认下单</span></button>
            </div>
        </div>
    </div>

    <!-- ===== 订单历史弹窗 ===== -->
    <div class="modal" id="historyModal">
        <div class="modal-box">
            <h2 id="historyTitle">📋 我的订单</h2>
            <p class="sub" id="historySub">你所有的订单记录</p>
            <div id="historyList"></div>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeHistory()" id="closeHistoryBtn">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  🔥 SUPABASE 配置
        // ================================================================
        const SB_URL = 'https://tvqecfgrupxworfmrpgp.supabase.co';
        const SB_KEY = 'sb_publishable_LXj2mPcP2N3vPFCN1dRKUw_CA0HhWNK';

        console.log('🚀 点单页面初始化...');

        console.log('✅ Supabase 客户端已创建');

        // ================================================================

        const translations = {

            }
        };

        let currentLang = 'zh';

        function t(key) {
            return translations[currentLang]?.[key] || key;
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('langZh').classList.toggle('active', lang === 'zh');
            document.getElementById('langEn').classList.toggle('active', lang === 'en');
            updateAllTexts();
            renderMenu();
            updateCart();
            renderOrderModal();
            renderHistory();
            updateOptionTexts();
        }

        function updateOptionTexts() {
            document.getElementById('pickupLocationLabel').textContent = t('pickupLocationLabel');
            document.getElementById('pickupTimeLabel').textContent = t('pickupTimeLabel');
            document.getElementById('paymentLabel').textContent = t('paymentLabel');
            document.getElementById('pickupLocation').placeholder = currentLang === 'zh' ? '例：A区柜台、打包台' :
            'e.g. Counter A';
        }

        function updateAllTexts() {
            document.getElementById('pageTitle').innerHTML = t('pageTitle');
            document.getElementById('nicknameLabel').textContent = t('nicknameLabel');
            document.getElementById('nicknameInput').placeholder = t('nicknamePlaceholder');
            document.getElementById('nicknameHint').textContent = t('nicknameHint');
            document.getElementById('loadingText').innerHTML = t('loading') + ' <span class="loading-spinner"></span>';
            document.getElementById('totalLabel').textContent = t('totalLabel');
            document.getElementById('checkoutText').textContent = t('checkout');
            document.getElementById('confirmTitle').textContent = t('confirmTitle');
            document.getElementById('confirmSub').textContent = t('confirmSub');
            document.getElementById('totalLabel2').textContent = t('totalLabel2');
            document.getElementById('editBtnText').textContent = t('edit');
            document.getElementById('confirmBtnText').textContent = t('confirm');
            document.getElementById('historyTitle').textContent = t('historyTitle');
            document.getElementById('historySub').textContent = t('historySub');
            document.getElementById('closeHistoryBtn').textContent = t('close');
            document.getElementById('historyBtnText').textContent = t('orderBtn');
            document.getElementById('confirmOrderBtn').innerHTML = '✅ ' + t('confirm');
            updateOptionTexts();
        }

        // ================================================================
        //  昵称
        // ================================================================
        const nicknameInput = document.getElementById('nicknameInput');
        const saved = localStorage.getItem('user_nickname');
        if (saved) nicknameInput.value = saved;
        nicknameInput.addEventListener('change', function() {
            const val = this.value.trim();
            if (val) localStorage.setItem('user_nickname', val);
            else localStorage.removeItem('user_nickname');
        });

        function getNickname() {
            return nicknameInput.value.trim() || t('anonymous');
        }

        // ================================================================
        //  取餐地点 + 取餐时间 + 付款方式
        // ================================================================
        const pickupLocation = document.getElementById('pickupLocation');
        const pickupTime = document.getElementById('pickupTime');
        const paymentRadios = document.querySelectorAll('input[name="payment"]');
        const optionSummary = document.getElementById('optionSummary');

        // 设置默认时间为当前时间 + 30 分钟
        function setDefaultPickupTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() + 30);
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            pickupTime.value = `${year}-${month}-${day}T${hours}:${minutes}`;
        }
        setDefaultPickupTime();

        function getOrderOptions() {
            const location = pickupLocation.value.trim() || t('noLocation');
            const time = pickupTime.value;
            let payment = 'QR';
            paymentRadios.forEach(el => {
                if (el.checked) payment = el.value;
            });
            const timeStr = time ? new Date(time).toLocaleString() : t('noTime');
            return { location, time, timeStr, payment };
        }

        function updateOptionSummary() {
            const options = getOrderOptions();
            const paymentLabel = options.payment === 'QR' ? 'QR' : 'Cash';
            optionSummary.textContent =
                `📍 ${options.location}  |  ⏰ ${options.timeStr}  |  💳 ${paymentLabel}`;
            optionSummary.classList.add('show');
        }

        pickupLocation.addEventListener('input', updateOptionSummary);
        pickupTime.addEventListener('change', updateOptionSummary);
        paymentRadios.forEach(el => {
            el.addEventListener('change', updateOptionSummary);
        });

        // ================================================================
        //  状态
        // ================================================================
        let menu = [];
        let cart = {};
        let pendingOrder = null;
        let myOrders = [];

        const menuGrid = document.getElementById('menuGrid');
        const totalItemsEl = document.getElementById('totalItems');
        const totalPriceEl = document.getElementById('totalPrice');
        const orderModal = document.getElementById('orderModal');
        const orderListEl = document.getElementById('orderList');
        const modalTotalPrice = document.getElementById('modalTotalPrice');
        const modalNickname = document.getElementById('modalNickname');
        const modalOptions = document.getElementById('modalOptions');
        const historyModal = document.getElementById('historyModal');
        const historyList = document.getElementById('historyList');
        const statusEl = document.getElementById('status');

        function formatPrice(amount) {
            return 'RM ' + Number(amount).toFixed(2);
        }

        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = 'status' + (type ? ' ' + type : '');
        }

        // ================================================================
        //  加载商品
        // ================================================================
        async function loadProducts() {
            setStatus('◐ 同步中...', 'loading');
            try {
                const { data, error } = await sbClient
                    .from('products')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;

                menu = data || [];
                renderMenu();
                updateCart();
                setStatus('● 已连接', '');
                console.log('📦 商品已加载，共', menu.length, '件');
            } catch (err) {
                console.error('❌ 加载失败:', err);
                setStatus('⚠️ 连接失败', 'error');
                menu = [];
                renderMenu();
            }
        }

        // ================================================================
        //  渲染商品
        // ================================================================
        function renderMenu() {
            menuGrid.innerHTML = '';
            if (menu.length === 0) {
                menuGrid.innerHTML = `
                    <div class="empty-state">
                        <p>📭 ${t('historyEmpty')}</p>
                        <p>${t('historyEmptySub')}</p>
                    </div>
                `;
                return;
            }

            menu.forEach(item => {
                const stock = item.stock || 0;
                const soldOut = stock <= 0;
                const low = stock > 0 && stock <= 3;

                let stockText = '';
                let stockClass = '';
                if (soldOut) {
                    stockText = t('stockOut');
                    stockClass = 'out';
                } else if (low) {
                    stockText = `${t('stockLow')} ${stock} ${t('stockUnit')}`;
                    stockClass = 'low';
                }

                const card = document.createElement('div');
                card.className = `card${soldOut ? ' sold-out' : ''}`;
                card.innerHTML = `
                    <img src="${item.img || 'https://placehold.co/300x300/e2e8f0/64748b?text=?'}" 
                         onerror="this.src='https://placehold.co/300x300/e2e8f0/64748b?text=?'">
                    <div class="name">${item.name}</div>
                    <div class="price">${formatPrice(item.price)}</div>
                    ${stockText ? `<div class="stock-info ${stockClass}">${stockText}</div>` : ''}
                    <div class="badge" id="badge-${item.id}" style="display:none;">0</div>
                    ${soldOut ? '<div class="sold-out-badge">' + t('stockOut') + '</div>' : ''}
                `;

                if (!soldOut) {
                    card.addEventListener('click', () => addToCart(item.id));
                }

                menuGrid.appendChild(card);
            });
        }

        // ================================================================
        //  购物车
        // ================================================================
        function addToCart(id) {
            const item = menu.find(p => p.id === id);
            if (!item) return;
            const current = cart[id] || 0;
            if (item.stock <= current) {
                alert(`❌ ${item.name} ${t('stockLow')} ${item.stock} ${t('stockUnit')}`);
                return;
            }
            cart[id] = (cart[id] || 0) + 1;
            updateCart();
        }

        function clearCart() {
            if (Object.keys(cart).length > 0 && confirm(t('clearCart'))) {
                cart = {};
                updateCart();
            }
        }

        function updateCart() {
            let qty = 0,
                total = 0;
            Object.keys(cart).forEach(id => {
                const count = cart[id];
                const item = menu.find(p => p.id === Number(id));
                if (item) {
                    qty += count;
                    total += item.price * count;
                }
            });

            totalItemsEl.textContent = qty + ' ' + t('itemsLabel');
            totalPriceEl.innerHTML = formatPrice(total) + ' <span>' + t('totalLabel') + '</span>';

            menu.forEach(item => {
                const badge = document.getElementById(`badge-${item.id}`);
                if (badge) {
                    const count = cart[item.id] || 0;
                    badge.style.display = count > 0 ? 'inline-block' : 'none';
                    badge.textContent = count;
                }
            });
        }

        // ================================================================
        //  打开订单弹窗
        // ================================================================
        function openOrderModal() {
            const items = Object.keys(cart);
            if (items.length === 0) {
                alert(t('cartEmpty'));
                return;
            }

            const nickname = getNickname();
            if (!nicknameInput.value.trim()) {
                alert(t('nicknameRequired'));
                nicknameInput.focus();
                return;
            }

            let errors = [];
            items.forEach(id => {
                const count = cart[id];
                const item = menu.find(p => p.id === Number(id));
                if (item && item.stock < count) {
                    errors.push(`${item.name}（需要 ${count}，剩 ${item.stock}）`);
                }
            });

            if (errors.length > 0) {
                alert(`❌ ${t('stockLow')}！\n\n${errors.join('\n')}`);
                return;
            }

            let orderItems = [];
            let total = 0;
            items.forEach(id => {
                const count = cart[id];
                const item = menu.find(p => p.id === Number(id));
                if (item) {
                    const subtotal = item.price * count;
                    total += subtotal;
                    orderItems.push({ id: item.id, name: item.name, price: item.price, qty: count });
                }
            });

            const options = getOrderOptions();

            pendingOrder = {
                nickname: nickname,
                items: orderItems,
                total: total,
                pickup_location: options.location,
                pickup_time: options.time,
                pickup_time_label: options.timeStr,
                payment: options.payment
            };

            renderOrderModal();
            orderModal.classList.add('active');
        }

        // ================================================================
        //  渲染订单弹窗
        // ================================================================
        function renderOrderModal() {
            if (!pendingOrder) return;

            let html = '';
            pendingOrder.items.forEach((item, index) => {
                const subtotal = item.price * item.qty;
                html += `
                    <div class="order-row" data-index="${index}">
                        <div class="info">
                            <span class="name">${item.name}</span>
                            <div class="qty-controls">
                                <button onclick="changeQty(${index}, -1)">−</button>
                                <span class="qty">${item.qty}</span>
                                <button onclick="changeQty(${index}, 1)">+</button>
                            </div>
                        </div>
                        <span class="subtotal">${formatPrice(subtotal)}</span>
                        <button class="delete-btn" onclick="deleteOrderItem(${index})">✕</button>
                    </div>
                `;
            });

            orderListEl.innerHTML = html;
            modalTotalPrice.textContent = formatPrice(pendingOrder.total);
            modalNickname.textContent = t('nicknameDisplay') + pendingOrder.nickname;
            modalOptions.innerHTML = `
                📍 ${pendingOrder.pickup_location} &nbsp;|&nbsp; ⏰ ${pendingOrder.pickup_time_label} &nbsp;|&nbsp; 💳 ${pendingOrder.payment}
            `;
        }

        // ================================================================
        //  修改数量
        // ================================================================
        function changeQty(index, delta) {
            if (!pendingOrder) return;
            const item = pendingOrder.items[index];
            if (!item) return;

            const newQty = item.qty + delta;
            if (newQty <= 0) {
                deleteOrderItem(index);
                return;
            }

            const product = menu.find(p => p.id === item.id);
            if (product && product.stock < newQty) {
                alert(`❌ ${product.name} ${t('stockLow')} ${product.stock} ${t('stockUnit')}`);
                return;
            }

            item.qty = newQty;
            pendingOrder.total = pendingOrder.items.reduce((sum, i) => sum + i.price * i.qty, 0);

            const cartId = item.id;
            if (cart[cartId] !== undefined) {
                cart[cartId] = newQty;
                if (cart[cartId] <= 0) delete cart[cartId];
            }

            updateCart();
            renderOrderModal();
        }

        // ================================================================
        //  删除商品
        // ================================================================
        function deleteOrderItem(index) {
            if (!pendingOrder) return;
            const item = pendingOrder.items[index];
            if (!item) return;

            const cartId = item.id;
            if (cart[cartId]) {
                delete cart[cartId];
            }

            pendingOrder.items.splice(index, 1);
            pendingOrder.total = pendingOrder.items.reduce((sum, i) => sum + i.price * i.qty, 0);

            updateCart();

            if (pendingOrder.items.length === 0) {
                orderModal.classList.remove('active');
                pendingOrder = null;
                return;
            }

            renderOrderModal();
        }

        // ================================================================
        //  确认订单
        // ================================================================
        async function confirmOrder() {
            if (!pendingOrder || pendingOrder.items.length === 0) {
                alert(t('cartEmpty'));
                return;
            }

            let errors = [];
            for (const item of pendingOrder.items) {
                const product = menu.find(p => p.id === item.id);
                if (product && product.stock < item.qty) {
                    errors.push(`${product.name}（需要 ${item.qty}，剩 ${product.stock}）`);
                }
            }

            if (errors.length > 0) {
                alert(`❌ ${t('stockLow')}！\n\n${errors.join('\n')}`);
                return;
            }

            try {
                for (const item of pendingOrder.items) {
                    const product = menu.find(p => p.id === item.id);
                    if (product) {
                        const newStock = Math.max(0, product.stock - item.qty);
                        await sbClient
                            .from('products')
                            .update({ stock: newStock })
                            .eq('id', item.id);
                        product.stock = newStock;
                    }
                }

                const { error } = await sbClient
                    .from('orders')
                    .insert({
                        nickname: pendingOrder.nickname,
                        items: pendingOrder.items,
                        total: pendingOrder.total,
                        status: 'pending',
                        pickup_location: pendingOrder.pickup_location,
                        pickup_time: pendingOrder.pickup_time,
                        payment: pendingOrder.payment
                    });

                if (error) throw error;

                alert(
                    `${t('orderSubmitted')}\n👤 ${pendingOrder.nickname}\n📦 ${pendingOrder.items.reduce((s, i) => s + i.qty, 0)} ${t('itemsLabel')}\n📍 ${pendingOrder.pickup_location}\n⏰ ${pendingOrder.pickup_time_label}\n💳 ${pendingOrder.payment}`
                    );

                cart = {};
                pendingOrder = null;
                updateCart();
                renderMenu();
                orderModal.classList.remove('active');

            } catch (err) {
                alert('❌ ' + err.message);
                console.error('提交失败:', err);
            }
        }

        // ================================================================
        //  订单历史
        // ================================================================
        async function loadMyOrders() {
            const nickname = getNickname();
            if (!nickname || nickname === t('anonymous')) {
                myOrders = [];
                return;
            }

            try {
                const { data, error } = await sbClient
                    .from('orders')
                    .select('*')
                    .eq('nickname', nickname)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                myOrders = data || [];
                console.log('📋 我的订单:', myOrders.length, '单');
            } catch (err) {
                console.error('❌ 加载订单失败:', err);
                myOrders = [];
            }
        }

        function openHistory() {
            const nickname = getNickname();
            if (!nicknameInput.value.trim()) {
                alert(t('nicknameRequired'));
                nicknameInput.focus();
                return;
            }

            loadMyOrders().then(() => {
                renderHistory();
                historyModal.classList.add('active');
            });
        }

        function closeHistory() {
            historyModal.classList.remove('active');
        }

        function renderHistory() {
            if (myOrders.length === 0) {
                historyList.innerHTML = `
                    <div class="history-empty">
                        <p>${t('historyEmpty')}</p>
                        <p>${t('historyEmptySub')}</p>
                    </div>
                `;
                return;
            }

            historyList.innerHTML = myOrders.map(order => {
                const itemsSummary = (order.items || []).map(i => `${i.name} ×${i.qty}`).join('、');
                const time = order.created_at ? new Date(order.created_at).toLocaleString() : '刚刚';
                const statusText = order.status === 'done' ? t('done') : t('pending');
                const statusClass = order.status === 'done' ? 'done' : 'pending';

                const location = order.pickup_location || t('noLocation');
                const pickupTime = order.pickup_time ? new Date(order.pickup_time).toLocaleString() : t('noTime');
                const payment = order.payment || '-';

                return `
                    <div class="history-item">
                        <div class="h-top">
                            <span class="h-nickname">👤 ${order.nickname || t('anonymous')}</span>
                            <span class="h-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="h-items">${itemsSummary}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px;">
                            <span class="h-time">${time}</span>
                            <span class="h-total">${formatPrice(order.total || 0)}</span>
                        </div>
                        <div class="h-options">
                            📍 ${location} &nbsp;|&nbsp; ⏰ ${pickupTime} &nbsp;|&nbsp; 💳 ${payment}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ================================================================
        //  事件绑定
        // ================================================================
        document.getElementById('checkoutBtn').addEventListener('click', openOrderModal);
        document.getElementById('clearCartBtn').addEventListener('click', clearCart);
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            orderModal.classList.remove('active');
        });
        document.getElementById('confirmOrderBtn').addEventListener('click', confirmOrder);
        document.getElementById('historyBtn').addEventListener('click', openHistory);
        orderModal.addEventListener('click', (e) => {
            if (e.target === orderModal) orderModal.classList.remove('active');
        });
        historyModal.addEventListener('click', (e) => {
            if (e.target === historyModal) historyModal.classList.remove('active');
        });

        nicknameInput.addEventListener('change', function() {
            if (this.value.trim()) {
                loadMyOrders();
            }
        });

        // ================================================================
        //  启动
        // ================================================================
        loadProducts();
        loadMyOrders();
        updateAllTexts();
        updateOptionSummary();
        console.log('✅ 点单页面加载完成');
    </script>
</body>
</html>
