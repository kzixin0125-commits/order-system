<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点单</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
        body { background: #f4f6fa; padding: 16px; padding-bottom: 100px; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { font-size: 24px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin-top: 16px; }
        .card { background: white; border-radius: 16px; padding: 14px; text-align: center; cursor: pointer; border: 2px solid transparent; }
        .card:active { transform: scale(0.96); border-color: #3b82f6; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; background: #eee; }
        .card .name { font-weight: 600; margin-top: 6px; }
        .card .price { color: #2563eb; font-weight: 700; }
        .badge { background: #3b82f6; color: white; border-radius: 30px; padding: 0 10px; display: inline-block; }
        .cart { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 16px 20px; display: flex; justify-content: space-between; border-top: 1px solid #ddd; flex-wrap: wrap; gap: 10px; }
        .btn { border: none; padding: 10px 24px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-secondary { background: #e2e8f0; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 999; padding: 20px; }
        .modal.active { display: flex; }
        .modal-box { background: white; max-width: 400px; width: 100%; padding: 24px; border-radius: 30px; max-height: 80vh; overflow-y: auto; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
        .status { font-size: 12px; color: #16a34a; }
        .status.loading { color: #f59e0b; }
        .status.error { color: #ef4444; }
        .nickname-area { background: white; border-radius: 16px; padding: 12px 16px; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .nickname-area input { flex: 1; padding: 8px 14px; border: 2px solid #e2e8f0; border-radius: 30px; font-size: 15px; min-width: 120px; }
        .nickname-area input:focus { border-color: #3b82f6; outline: none; }
        .order-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #eee; }
        .sold-out { opacity: 0.5; cursor: not-allowed; }
        .empty { text-align: center; color: #94a3b8; padding: 40px 0; }
        .sync-btn { background: #16a34a; color: white; border: none; padding: 6px 16px; border-radius: 30px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧾 点单</h1>
        <div>
            <button class="sync-btn" onclick="loadData()">🔄 刷新</button>
            <span class="status" id="status">● 已连接</span>
        </div>
    </div>

    <div class="nickname-area">
        <label>👤 昵称</label>
        <input type="text" id="nickname" placeholder="输入你的名字" maxlength="20">
    </div>

    <div class="grid" id="menuGrid">
        <div class="empty">⏳ 加载中...</div>
    </div>

    <div class="cart">
        <div>
            <span id="totalItems">0 件</span>
            <strong id="totalPrice">RM0</strong>
        </div>
        <div>
            <button class="btn btn-secondary" onclick="clearCart()">🗑️</button>
            <button class="btn btn-primary" onclick="openOrder()">📦 结单</button>
        </div>
    </div>

    <div class="modal" id="orderModal">
        <div class="modal-box">
            <h2>📋 确认订单</h2>
            <div id="orderList"></div>
            <div style="display:flex; justify-content:space-between; font-weight:700; font-size:20px; margin:12px 0;">
                <span>合计</span>
                <span id="modalTotal">RM0</span>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">修改</button>
                <button class="btn btn-primary" onclick="confirmOrder()">✅ 确认</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  🔥 配置 - 改成你的 GitHub Raw 链接！
        // ================================================================
        const DATA_URL = 'https://raw.githubusercontent.com/kzixin0125-commits/order-system/refs/heads/main/data.json';

        // ================================================================
        //  状态
        // ================================================================
        let menu = [];
        let cart = {};
        let orderItems = [];
        const statusEl = document.getElementById('status');

        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = 'status' + (type ? ' ' + type : '');
        }

        function formatPrice(amount) {
            return 'RM ' + Number(amount).toFixed(2);
        }

        // ================================================================
        //  读取数据（从 GitHub 下载 JSON）
        // ================================================================
        async function loadData() {
            setStatus('◐ 加载中...', 'loading');
            try {
                const res = await fetch(DATA_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error('网络错误');
                const data = await res.json();
                menu = data.products || [];
                renderMenu();
                updateCart();
                setStatus('● 已连接', '');
                console.log('✅ 加载成功，商品数:', menu.length);
            } catch (err) {
                setStatus('⚠️ 连接失败', 'error');
                console.error('❌ 加载失败:', err);
                menu = [];
                renderMenu();
            }
        }

        // ================================================================
        //  渲染商品
        // ================================================================
        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            if (menu.length === 0) {
                grid.innerHTML = '<div class="empty">📭 暂无商品</div>';
                return;
            }

            grid.innerHTML = menu.map(item => {
                const soldOut = item.stock <= 0;
                return `
                    <div class="card ${soldOut ? 'sold-out' : ''}" onclick="${soldOut ? '' : `addToCart(${item.id})`}">
                        <img src="${item.img || 'https://placehold.co/300x300/eee/999?text=?'}" onerror="this.src='https://placehold.co/300x300/eee/999?text=?'">
                        <div class="name">${item.name}</div>
                        <div class="price">${formatPrice(item.price)}</div>
                        ${item.stock <= 3 && item.stock > 0 ? `<small style="color:#ef4444;">仅剩 ${item.stock} 件</small>` : ''}
                        ${soldOut ? '<small style="color:#ef4444;font-weight:700;">售罄</small>' : ''}
                        <div class="badge" id="badge-${item.id}" style="display:none;">0</div>
                    </div>
                `;
            }).join('');
        }

        // ================================================================
        //  购物车
        // ================================================================
        function addToCart(id) {
            const item = menu.find(p => p.id === id);
            if (!item) return;
            if (item.stock <= (cart[id] || 0)) {
                alert(`❌ ${item.name} 只剩 ${item.stock} 件`);
                return;
            }
            cart[id] = (cart[id] || 0) + 1;
            updateCart();
        }

        function clearCart() {
            if (Object.keys(cart).length && confirm('清空购物车？')) {
                cart = {};
                updateCart();
            }
        }

        function updateCart() {
            let qty = 0,
                total = 0;
            Object.keys(cart).forEach(id => {
                const count = cart[id];
                const item = menu.find(p => p.id === Number(id));
                if (item) {
                    qty += count;
                    total += item.price * count;
                }
            });

            document.getElementById('totalItems').textContent = qty + ' 件';
            document.getElementById('totalPrice').textContent = formatPrice(total);

            menu.forEach(item => {
                const badge = document.getElementById(`badge-${item.id}`);
                if (badge) {
                    const count = cart[item.id] || 0;
                    badge.style.display = count > 0 ? 'inline-block' : 'none';
                    badge.textContent = count;
                }
            });
        }

        // ================================================================
        //  昵称
        // ================================================================
        const nicknameInput = document.getElementById('nickname');
        const saved = localStorage.getItem('user_nickname');
        if (saved) nicknameInput.value = saved;
        nicknameInput.addEventListener('change', function() {
            const val = this.value.trim();
            if (val) localStorage.setItem('user_nickname', val);
            else localStorage.removeItem('user_nickname');
        });

        function getNickname() {
            return nicknameInput.value.trim() || '顾客';
        }

        // ================================================================
        //  结单
        // ================================================================
        function openOrder() {
            const items = Object.keys(cart);
            if (items.length === 0) {
                alert('🛒 购物车是空的');
                return;
            }

            const nickname = getNickname();
            if (!nicknameInput.value.trim()) {
                alert('👤 请输入昵称');
                nicknameInput.focus();
                return;
            }

            // 检查库存
            let errors = [];
            items.forEach(id => {
                const count = cart[id];
                const item = menu.find(p => p.id === Number(id));
                if (item && item.stock < count) {
                    errors.push(`${item.name}（需要 ${count}，剩 ${item.stock}）`);
                }
            });

            if (errors.length > 0) {
                alert(`❌ 库存不足：\n${errors.join('\n')}`);
                return;
            }

            let html = '',
                total = 0;
            orderItems = [];
            items.forEach(id => {
                const count = cart[id];
                const item = menu.find(p => p.id === Number(id));
                if (item) {
                    const subtotal = item.price * count;
                    total += subtotal;
                    orderItems.push({ id: item.id, name: item.name, price: item.price, qty: count });
                    html += `<div class="order-item"><span><strong>${item.name}</strong> ×${count}</span><span>${formatPrice(subtotal)}</span></div>`;
                }
            });

            document.getElementById('orderList').innerHTML = html;
            document.getElementById('modalTotal').textContent = formatPrice(total);
            document.getElementById('orderModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        // ================================================================
        //  确认订单（发送到商家邮箱/保存到本地）
        // ================================================================
        function confirmOrder() {
            if (!orderItems.length) return;

            // 把订单保存到浏览器（商家可以从控制台查看）
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orders.push({
                nickname: getNickname(),
                items: orderItems,
                total: orderItems.reduce((s, i) => s + i.price * i.qty, 0),
                time: new Date().toLocaleString(),
                status: 'pending'
            });
            localStorage.setItem('orders', JSON.stringify(orders));

            // 扣减库存（本地）
            orderItems.forEach(item => {
                const product = menu.find(p => p.id === item.id);
                if (product) product.stock = Math.max(0, product.stock - item.qty);
            });

            alert(`✅ 订单已提交！\n👤 ${getNickname()}\n📦 ${orderItems.reduce((s, i) => s + i.qty, 0)} 件`);

            cart = {};
            orderItems = [];
            updateCart();
            renderMenu();
            closeModal();
        }

        // ================================================================
        //  启动
        // ================================================================
        loadData();
        console.log('✅ 点单页面加载完成');
    </script>
</body>
</html>
